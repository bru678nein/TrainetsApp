name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Por los targets del Makefile, igual que el backend: si el workflow
      # repitiera los comandos, divergirían de lo que corre `make check` en
      # cuanto uno de los dos cambie. Ya pasó una vez en este repositorio.
      - run: make front-lint
      - run: make front-test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coachapp_test
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      # Los tests borran el esquema y lo recrean con Alembic. conftest.py exige
      # que el nombre de la base termine en '_test' antes de tocar nada.
      #
      # TEST_DSN lo consume el Makefile (override del `?=`) y termina como
      # TEST_DATABASE_URL, que es la variable que conftest.py mira primero.
      # DATABASE_URL queda sólo para el CLI de Alembic, que es lo que lee
      # migrations/env.py. Acá apuntan a la misma base porque en CI no hay otra;
      # localmente son distintas y esa diferencia importa.
      TEST_DSN: postgresql+psycopg://coach:coach@localhost:5432/coachapp_test
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coachapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Artículo I — el dominio no conoce la infraestructura
        run: |
          if grep -rEl "sqlalchemy|fastapi|psycopg" backend/app/domain/; then
            echo "::error::app/domain/ importa infraestructura (constitución, artículo I)"
            exit 1
          fi
      # Lint y tests se invocan por los targets del Makefile, no reescribiendo
      # los comandos acá. `PY_RUN=python` reemplaza al intérprete del venv: en
      # CI las dependencias están instaladas en el Python del runner. El cwd,
      # las variables de entorno y los flags salen de un solo lugar; si CI los
      # repitiera, tarde o temprano divergen de lo que corre `make check`.
      #
      # Todo por `python -m`, nunca por el nombre del ejecutable: el directorio
      # de scripts de pip no siempre está en el PATH del runner, y ahí el
      # comando falla con "not found" en vez de con algo que se entienda.
      - run: make lint PY_RUN=python
      - name: Las migraciones aplican y revierten sobre una base vacía
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
        working-directory: backend
      # La migración 0003 crea el rol de aplicación sin contraseña: una
      # contraseña versionada está en cada clon y en el historial para siempre.
      # Se la pone la infraestructura, y acá la infraestructura es esto.
      #
      # Por el mismo target del Makefile que se usa localmente, no por un `psql`
      # escrito acá: dos formas de hacer lo mismo divergen en cuanto una cambia,
      # y eso ya pasó una vez en este repo. `ADMIN_DSN` es lo único distinto.
      #
      # El `upgrade head` del paso anterior dejó el rol creado; su `downgrade
      # base` revirtió todo salvo el rol, que es cluster-wide y no se borra.
      - name: Contraseña del rol de aplicación
        run: make db-app-password PY_RUN=python ADMIN_DSN="$DATABASE_URL"
      - run: make test PY_RUN=python PYTEST_ARGS="--cov=app --cov-report=term-missing"
