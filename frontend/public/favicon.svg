<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- El bloque es lo planificado; el hueco, lo que no se hizo. La distancia
       entre las dos cosas es el producto.

       `currentColor` no sirve en un favicon —el navegador lo dibuja fuera de
       todo documento—, así que el color va literal y cambia con el esquema del
       sistema. Los dos son los mismos `--hecho` de la aplicación. -->
  <style>
    path { fill: #3d6b8f; }
    @media (prefers-color-scheme: dark) { path { fill: #7aa9cf; } }
  </style>
  <path d="M8 3h9v11h11v9a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V9a6 6 0 0 1 5-6z"/>
</svg>
