[project]
name = "coachapp-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008 prohíbe llamadas a función en argumentos por defecto, pero en FastAPI ese
# ES el patrón idiomático de inyección de dependencias. Sin esta excepción, ruff
# marca cada endpoint del proyecto.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Los modelos declarativos de SQLAlchemy tienen líneas largas por naturaleza
# (mapped_column con varios argumentos). Partirlas empeora la legibilidad.
"app/models.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
